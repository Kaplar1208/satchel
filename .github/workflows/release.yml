name: Release
# Runs when module.json changes on a push to main, or manually from the
# "Actions" tab in case something needs to be retried.
on:
  push:
    branches: [main]
    paths:
      - module.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from module.json
        id: version
        run: |
          VERSION=$(node -p "require('./module.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether a release already exists for this version
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build module zip
        if: steps.check_release.outputs.exists == 'false'
        run: |
          mkdir -p build
          cp module.json build/module.json
          # The module.json inside the zip and attached to the release points at this exact version.
          sed -i "s|releases/latest/download|releases/download/${{ steps.version.outputs.tag }}|g" build/module.json
          cp -r lang scripts styles LICENSE README.md build/
          cd build
          zip -r ../satchel.zip .

      - name: Create tag
        if: steps.check_release.outputs.exists == 'false'
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release (draft)
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          draft: true
          generate_release_notes: true
          files: |-
            satchel.zip
            build/module.json
